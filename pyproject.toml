[project]
name = "streamed-trader"
version = "0.1.0"
description = "Binance Futures algorithmic trading system: candle fetching, backtesting, and live trading engine."
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "pandas_market_calendars",
    "python-binance",
    "requests",
    "tqdm",
    "python-dotenv",
]

[project.scripts]
streamed-trader = "core.examples.trader:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
